id = "windows-11"
name = "Windows 11"
priority = 40

[match]
family = "windows"
edition = "client"
build_min = 22000

[hardware]
machine = "q35"
cpu_model = "host"
cpus = 4
memory_mib = 8192
min_memory_mib = 4096
firmware = "uefi-secure"      # Windows 11 requires UEFI with Secure Boot ...
tpm = "2.0"                   # ... and a TPM 2.0 (a real swtpm, no bypass)
rtc = "localtime"
rtc_catchup = true            # re-inject lost clock ticks (KVM)
hyperv = true
hpet = false
disk_bus = "auto"
nic = "e1000e"
display = "VGA"
sound = "ich9-intel-hda"
usb = "qemu-xhci"
pointer = "usb-tablet"
cdrom_bus = "sata"
agent = true
vdagent = true

[paravirt]
disk_bus = "virtio"
nic = "virtio-net-pci"
display = "virtio-vga"

[create]
disk_size = "80G"
disk_bus = "sata"

[patches]
list = ["windows.hibernation", "windows.bitlocker", "windows.storage.boot_drivers",
        "windows.disable_services", "windows.hostile_software", "windows.virt_v2v"]

[notes]
list = [
  "Windows will probably ask to be re-activated because the hardware changed.",
  "If BitLocker protects the system drive, Windows asks for the recovery key at the first boot: the virtual TPM cannot match the physical one.",
]
