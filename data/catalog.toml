description = "Download the Windows 10 disk image (ISO) from Microsoft. Note: Windows 10 support ended on 14 October 2025."
osinfo = ["win10", "windows-modern"]
kind = "external"
url = "https://www.microsoft.com/software-download/windows10ISO"
homepage = "https://www.microsoft.com/windows"
license = "Proprietary. Needs a Windows licence to activate."
unattended = true
size = "6 GB"

[[os]]
id = "windows-server-eval"
name = "Windows Server 2025 (evaluation)"
description = "Free 180-day evaluation from Microsoft's Evaluation Center (registration required). Installs without a product key."
osinfo = ["win2k25", "windows-modern"]
kind = "external"
url = "https://www.microsoft.com/evalcenter/evaluate-windows-server-2025"
homepage = "https://www.microsoft.com/windows-server"
license = "Proprietary evaluation licence (180 days)."
unattended = true
size = "6 GB"
