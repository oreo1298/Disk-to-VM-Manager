# Rehome appliance: no text logins on other consoles; the power button shuts
# the VM down cleanly (handled by Rehome) instead of cutting it off.
[Login]
NAutoVTs=0
ReserveVT=0
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleRebootKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
