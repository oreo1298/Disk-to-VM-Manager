# Quick Create catalog: free operating systems Rehome can download for you.
#
# Rules (see rehome/media/catalog.py):
# * Images come only from the project's official download servers (or, where a
#   project has no download server of its own, a mirror the project lists).
# * Every image is verified against the project's published checksum, fetched
#   over HTTPS at download time. Entries where no checksum is published say so
#   in `verification`.
# * The current version is discovered at download time from a machine-readable
#   index (directory listing, checksum list, releases.json, SourceForge file
#   list), so the catalog does not go stale.
# * Windows is never downloaded automatically: "external" entries only open
#   Microsoft's own download or Evaluation Center page.
#
# Fields
#   id, name, description, homepage, license   shown in the UI
#   osinfo        libosinfo short IDs tried in order (first one known to this
#                 computer's osinfo-db wins); may end with a Rehome profile ID.
#                 {version}, {series}, {major}, {major_minor} are filled in
#                 from the discovered version.
#   kind          "direct" (Rehome downloads it) or "external" (open `url`)
#   unattended    whether `--unattended` installs are supported
#   size          approximate download size (informational)
#   [os.resolver] how to find the current image; `type` is one of
#     checksum-list   index (+ optional version_dir regex), checksum_file,
#                     file regex(es); optional subdirs, checksum_optional,
#                     archive_member
#     fedora-releases releases.json + the CHECKSUM file next to the image
#     sourceforge     project, path, version_dir, file, archive_member
#   Regexes match whole file names; {version}/{series} inside them are replaced
#   by the (escaped) discovered version.

schema = 1

[[os]]
id = "ubuntu-desktop-lts"
name = "Ubuntu Desktop LTS"
description = "Ubuntu with the GNOME desktop. Long-term support release with five years of free security updates."
osinfo = ["ubuntu{series}", "ubuntu24.04", "linux"]
kind = "direct"
homepage = "https://ubuntu.com/desktop"
license = "Free and open-source software (mainly GPL). Ubuntu is a trademark of Canonical Ltd."
unattended = true
unattended_note = "Uses the Ubuntu Desktop installer's autoinstall support (24.04 and later). Less tested than Ubuntu Server."
size = "6 GB"

[os.resolver]
type = "checksum-list"
index = "https://releases.ubuntu.com/"
version_dir = 'href="(\d[02468]\.04)/"'          # LTS releases are YY.04 with an even year
checksum_file = "SHA256SUMS"
file = 'ubuntu-({series}(?:\.\d+)*)-desktop-amd64\.iso'

[[os]]
id = "ubuntu-server-lts"
name = "Ubuntu Server LTS"
description = "Ubuntu for servers, without a desktop. Long-term support release with five years of free security updates."
osinfo = ["ubuntu{series}", "ubuntu24.04", "linux"]
kind = "direct"
homepage = "https://ubuntu.com/server"
license = "Free and open-source software (mainly GPL). Ubuntu is a trademark of Canonical Ltd."
unattended = true
size = "3 GB"

[os.resolver]
type = "checksum-list"
index = "https://releases.ubuntu.com/"
version_dir = 'href="(\d[02468]\.04)/"'
checksum_file = "SHA256SUMS"
file = 'ubuntu-({series}(?:\.\d+)*)-live-server-amd64\.iso'

[[os]]
id = "fedora-workstation"
name = "Fedora Workstation"
description = "Fedora's desktop edition with the latest GNOME. A new release every six months."
osinfo = ["fedora{version}", "fedora42", "fedora-unknown", "linux"]
kind = "direct"
homepage = "https://fedoraproject.org/workstation/"
license = "Free and open-source software. Fedora is a trademark of Red Hat, Inc."
unattended = false
unattended_note = "The Workstation live image cannot install automatically; use Fedora Server for unattended installs."
size = "2.5 GB"

[os.resolver]
type = "fedora-releases"
index = "https://fedoraproject.org/releases.json"
variant = "Workstation"
subvariant = "Workstation"
arch = "x86_64"
link = 'Fedora-Workstation-Live-.*\.iso'
checksum_host = "https://dl.fedoraproject.org"   # Fedora's master server (download.* redirects to mirrors)

[[os]]
id = "fedora-server"
name = "Fedora Server"
description = "Fedora's server edition (DVD installer, works offline). Supports fully automatic installation."
osinfo = ["fedora{version}", "fedora42", "fedora-unknown", "linux"]
kind = "direct"
homepage = "https://fedoraproject.org/server/"
license = "Free and open-source software. Fedora is a trademark of Red Hat, Inc."
unattended = true
size = "2.5 GB"

[os.resolver]
type = "fedora-releases"
index = "https://fedoraproject.org/releases.json"
variant = "Server"
subvariant = "Server"
arch = "x86_64"
link = 'Fedora-Server-dvd-x86_64-.*\.iso'
checksum_host = "https://dl.fedoraproject.org"

[[os]]
id = "debian"
name = "Debian"
description = "The universal operating system: stable, conservative and community-run. Network installer (needs internet during setup)."
osinfo = ["debian{major}", "debian13", "debian12", "linux"]
kind = "direct"
homepage = "https://www.debian.org/"
license = "Free software (Debian Free Software Guidelines)."
unattended = true
unattended_note = "The network installer downloads most packages during setup, so the VM needs internet access."
size = "0.7 GB"

[os.resolver]
type = "checksum-list"
index = "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/"
checksum_file = "SHA256SUMS"
file = 'debian-(\d+(?:\.\d+)+)-amd64-netinst\.iso'

[[os]]
id = "opensuse-tumbleweed"
name = "openSUSE Tumbleweed"
description = "openSUSE's rolling release: always the latest tested software. Offline DVD installer."
osinfo = ["opensusetumbleweed", "linux"]
kind = "direct"
homepage = "https://get.opensuse.org/tumbleweed/"
license = "Free and open-source software. openSUSE is a trademark of SUSE LLC."
unattended = true
size = "4.5 GB"

[os.resolver]
type = "checksum-list"
index = "https://download.opensuse.org/tumbleweed/iso/"
checksum_file = "openSUSE-Tumbleweed-DVD-x86_64-Current.iso.sha256"
file = ['openSUSE-Tumbleweed-DVD-x86_64-Snapshot(\d+)-Media\.iso',
        'openSUSE-Tumbleweed-DVD-x86_64-Current\.iso']

[[os]]
id = "archlinux"
name = "Arch Linux"
description = "A lightweight, rolling-release distribution for experienced users. Installation is manual (see the ArchWiki installation guide)."
osinfo = ["archlinux", "linux"]
kind = "direct"
homepage = "https://archlinux.org/"
license = "Free and open-source software. Arch Linux is a trademark of the Arch Linux project."
unattended = false
size = "1.2 GB"

[os.resolver]
type = "checksum-list"
index = "https://geo.mirror.pkgbuild.com/iso/latest/"   # Arch's official GeoDNS mirror
checksum_file = "sha256sums.txt"
file = 'archlinux-(\d{4}\.\d{2}\.\d{2})-x86_64\.iso'

[[os]]
id = "linuxmint"
name = "Linux Mint Cinnamon"
description = "A friendly desktop based on Ubuntu LTS, with the Cinnamon desktop."
osinfo = ["linuxmint{version}", "ubuntu24.04", "linux"]
kind = "direct"
homepage = "https://linuxmint.com/"
license = "Free and open-source software. Linux Mint is a trademark of Clement Lefebvre."
unattended = false
size = "3 GB"
# Linux Mint publishes its images only through the mirrors listed on
# https://linuxmint.com/mirrors.php; kernel.org is one of them.
verification = "SHA-256 from Linux Mint's sha256sum.txt on the kernel.org mirror (listed by Linux Mint)."

[os.resolver]
type = "checksum-list"
index = "https://mirrors.kernel.org/linuxmint/stable/"
version_dir = 'href="(\d+(?:\.\d+)?)/"'
checksum_file = "sha256sum.txt"
file = 'linuxmint-({version})-cinnamon-64bit\.iso'

[[os]]
id = "freebsd"
name = "FreeBSD"
description = "A complete operating system for servers and desktops, with a long Unix heritage. Text-mode installer."
osinfo = ["freebsd{major_minor}", "freebsd{major}.0", "freebsd14.2", "freebsd14.0", "bsd"]
kind = "direct"
homepage = "https://www.freebsd.org/"
license = "BSD license. FreeBSD is a registered trademark of The FreeBSD Foundation."
unattended = false
size = "1.3 GB"

[os.resolver]
type = "checksum-list"
index = "https://download.freebsd.org/releases/ISO-IMAGES/"
version_dir = 'href="(\d+\.\d+)/"'
checksum_file = "CHECKSUM.SHA256-FreeBSD-{version}-RELEASE-amd64"
file = 'FreeBSD-({version})-RELEASE-amd64-disc1\.iso'

[[os]]
id = "freedos"
name = "FreeDOS"
description = "A complete, free DOS-compatible operating system for classic DOS games and programs."
osinfo = ["freedos{version}", "freedos1.3", "dos"]
kind = "direct"
homepage = "https://www.freedos.org/"
license = "Free software (mainly GPL)."
unattended = false
size = "0.5 GB"
verification = "FreeDOS does not publish a SHA-256 list for its release images that Rehome could confirm. If the release directory has a verify.txt with SHA-256 sums, it is used; otherwise only the HTTPS connection, the file size and the ZIP archive's internal CRC-32 checks are verified."

[os.resolver]
type = "checksum-list"
index = "https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/"
version_dir = 'href="(1\.\d+)/"'
subdirs = ["", "official/"]
checksum_file = "verify.txt"
checksum_optional = true
file = 'FD\d+-LiveCD\.zip'
archive_member = '(?i)FD\d+LIVE\.iso'

[[os]]
id = "reactos"
name = "ReactOS"
description = "An open-source operating system that runs Windows programs and drivers (alpha quality, for experiments)."
osinfo = ["reactos0.4", "reactos"]
kind = "direct"
homepage = "https://reactos.org/"
license = "Free software (mainly GPL)."
unattended = false
size = "0.2 GB"
verification = "SHA-256 published by SourceForge for the file in the ReactOS project (SHA-1 for older files)."

[os.resolver]
type = "sourceforge"
project = "reactos"
path = "ReactOS"
version_dir = '\d+\.\d+\.\d+'
file = 'ReactOS-{version}(?:-release-\d+-g[0-9a-f]+)?-(?:i386|x86)(?:-iso)?\.zip'
archive_member = '(?i)(?!.*live).*\.iso'

# --- Windows: Microsoft's own pages only -------------------------------------

[[os]]
id = "windows-11"
name = "Windows 11"
description = "Download the Windows 11 disk image (ISO) from Microsoft, then create the VM from it. Rehome gives it UEFI with Secure Boot and a virtual TPM 2.0."
osinfo = ["win11", "windows-11"]
kind = "external"
url = "https://www.microsoft.com/software-download/windows11"
homepage = "https://www.microsoft.com/windows"
license = "Proprietary. Needs a Windows licence to activate."
unattended = true
size = "6 GB"

[[os]]
id = "windows-11-enterprise-eval"
name = "Windows 11 Enterprise (evaluation)"
description = "Free 90-day evaluation from Microsoft's Evaluation Center (registration required). Installs without a product key."
osinfo = ["win11", "windows-11"]
kind = "external"
url = "https://www.microsoft.com/evalcenter/evaluate-windows-11-enterprise"
homepage = "https://www.microsoft.com/evalcenter"
license = "Proprietary evaluation licence (90 days)."
unattended = true
size = "6 GB"

[[os]]
id = "windows-10"
